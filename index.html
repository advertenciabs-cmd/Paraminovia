<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Un Jardín de Amor ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% 30%, #111827 0%, #030712 100%);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      overflow: hidden;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Frases dinámicas en la parte superior central */
    .top-banner {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 20;
      font-family: 'Dancing Script', cursive;
      font-size: 1.5rem;
      color: #fbbf24;
      text-shadow: 0 0 10px rgba(251, 191, 36, 0.6);
      opacity: 0;
      transition: opacity 1s ease-in-out;
      pointer-events: none;
      white-space: nowrap;
    }

    .top-banner.visible {
      opacity: 1;
    }

    /* Cuenta regresiva estilizada y grande */
    .countdown-widget {
      position: fixed;
      top: 20px;
      right: 25px;
      z-index: 25;
      background: rgba(17, 24, 39, 0.85);
      border: 1.5px solid rgba(251, 191, 36, 0.5);
      padding: 12px 18px;
      border-radius: 22px;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(251, 191, 36, 0.2);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .countdown-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: #fbbf24;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .countdown-display {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .time-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(251, 191, 36, 0.1);
      border: 1px solid rgba(251, 191, 36, 0.3);
      padding: 6px 10px;
      border-radius: 12px;
      min-width: 48px;
    }

    .time-num {
      font-size: 1.25rem;
      font-weight: 800;
      color: #fef08a;
      line-height: 1;
      text-shadow: 0 0 8px rgba(251, 191, 36, 0.5);
    }

    .time-label {
      font-size: 0.58rem;
      color: #d1d5db;
      font-weight: 600;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .time-dots {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fbbf24;
      margin-top: -8px;
    }

    .main-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      width: 95%;
      max-width: 1100px;
      gap: 40px;
    }

    .canvas-box {
      position: relative;
      width: 480px;
      height: 520px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    #tree-canvas {
      width: 100%;
      height: 100%;
    }

    .interactive-panel {
      flex: 1;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: center;
      opacity: 0;
      transform: translateY(30px);
      pointer-events: none;
      transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .interactive-panel.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .counter-badge {
      background: rgba(17, 24, 39, 0.7);
      border: 1px solid rgba(251, 191, 36, 0.4);
      padding: 12px 26px;
      border-radius: 40px;
      font-size: 0.95rem;
      font-weight: 500;
      color: #fef08a;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
      text-align: center;
      letter-spacing: 0.5px;
      transition: all 0.5s ease;
    }

    .counter-badge.unlocked {
      background: rgba(251, 191, 36, 0.25);
      border-color: #fbbf24;
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 0 25px rgba(251, 191, 36, 0.6);
      transform: scale(1.05);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      width: 100%;
    }

    .card-item {
      background: rgba(17, 24, 39, 0.65);
      border: 1px solid rgba(251, 191, 36, 0.25);
      border-radius: 20px;
      padding: 22px 12px;
      text-align: center;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      position: relative;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .card-item:hover:not(.opened) {
      transform: translateY(-8px) scale(1.03);
      border-color: rgba(251, 191, 36, 0.8);
      box-shadow: 0 15px 30px rgba(251, 191, 36, 0.25);
    }

    .card-item.opened {
      background: rgba(251, 191, 36, 0.15);
      border-color: rgba(251, 191, 36, 0.8);
      box-shadow: 0 0 20px rgba(251, 191, 36, 0.2);
    }

    .card-icon {
      font-size: 2rem;
      transition: transform 0.3s ease;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
    }

    .card-item:hover .card-icon {
      transform: scale(1.2);
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #f3f4f6;
      letter-spacing: 0.5px;
    }

    .secret-letter-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #f59e0b, #fbbf24, #d97706);
      background-size: 200% 200%;
      color: #0f172a;
      border: none;
      border-radius: 24px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 35px rgba(251, 191, 36, 0.5);
      transition: all 0.4s ease;
      display: none;
      animation: pulseGlow 2s infinite, gradientMove 4s ease infinite;
    }

    .secret-letter-btn.visible {
      display: block;
    }

    @keyframes pulseGlow {
      0% { transform: scale(1); box-shadow: 0 0 20px rgba(251, 191, 36, 0.4); }
      50% { transform: scale(1.03); box-shadow: 0 0 45px rgba(251, 191, 36, 0.8); }
      100% { transform: scale(1); box-shadow: 0 0 20px rgba(251, 191, 36, 0.4); }
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(12px);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: rgba(17, 24, 39, 0.95);
      border: 1.5px solid rgba(251, 191, 36, 0.6);
      padding: 40px 32px;
      border-radius: 28px;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(251, 191, 36, 0.25);
      text-align: center;
      transform: scale(0.85) translateY(20px);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.active .modal-card {
      transform: scale(1) translateY(0);
    }

    .modal-card h2 {
      font-family: 'Dancing Script', cursive;
      font-size: 3rem;
      color: #fbbf24;
      margin-bottom: 16px;
      text-shadow: 0 0 15px rgba(251, 191, 36, 0.5);
    }

    .modal-card p {
      font-size: 1rem;
      line-height: 1.8;
      color: #f3f4f6;
      white-space: pre-line;
      margin-bottom: 24px;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .close-btn {
      padding: 12px 36px;
      background: linear-gradient(135deg, #fbbf24, #d97706);
      color: #0f172a;
      border: none;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(251, 191, 36, 0.4);
      transition: all 0.25s ease;
      width: 100%;
      max-width: 250px;
    }

    .close-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 25px rgba(251, 191, 36, 0.7);
    }

    .whatsapp-btn {
      padding: 14px 28px;
      background: #25d366;
      color: #ffffff;
      border: none;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.98rem;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
      transition: all 0.25s ease;
      text-decoration: none;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      max-width: 280px;
    }

    .whatsapp-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 25px rgba(37, 211, 102, 0.7);
      background: #20ba5a;
    }

    .start-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 42px;
      background: linear-gradient(135deg, #fbbf24, #d97706);
      color: #0f172a;
      border: none;
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 0 40px rgba(251, 191, 36, 0.7);
      transition: all 0.3s ease;
      z-index: 20;
    }

    .start-btn:hover {
      transform: translate(-50%, -50%) scale(1.08);
      box-shadow: 0 0 60px rgba(251, 191, 36, 0.95);
    }

    .audio-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 30;
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid rgba(251, 191, 36, 0.4);
      padding: 10px 18px;
      border-radius: 35px;
      display: flex;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(12px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
    }

    .audio-control {
      background: transparent;
      border: none;
      font-size: 0.88rem;
      color: #fbbf24;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    .volume-slider {
      width: 85px;
      accent-color: #fbbf24;
      cursor: pointer;
    }

    @media (max-width: 850px) {
      .main-container { flex-direction: column-reverse; }
      .canvas-box { width: 340px; height: 390px; }
      .cards-grid { grid-template-columns: repeat(2, 1fr); }
      .top-banner { display: none; }
      .countdown-widget { top: 12px; right: 50%; transform: translateX(50%); width: 90%; max-width: 340px; }
      .time-block { min-width: 40px; padding: 4px 6px; }
      .time-num { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div class="top-banner" id="topBanner">✨ Un detalle hecho con el corazón ✨</div>

  <!-- Contador visualmente mejorado -->
  <div class="countdown-widget">
    <div class="countdown-header">
      <span>💍</span> Nuestro Aniversario (22 Ene)
    </div>
    <div class="countdown-display">
      <div class="time-block">
        <span class="time-num" id="cd-days">00</span>
        <span class="time-label">Días</span>
      </div>
      <span class="time-dots">:</span>
      <div class="time-block">
        <span class="time-num" id="cd-hours">00</span>
        <span class="time-label">Horas</span>
      </div>
      <span class="time-dots">:</span>
      <div class="time-block">
        <span class="time-num" id="cd-mins">00</span>
        <span class="time-label">Min</span>
      </div>
      <span class="time-dots">:</span>
      <div class="time-block">
        <span class="time-num" id="cd-secs">00</span>
        <span class="time-label">Seg</span>
      </div>
    </div>
  </div>

  <div class="main-container">
    <div class="interactive-panel" id="cardsPanel">
      <div class="counter-badge" id="counterBadge">Abre las 6 cartas para desbloquear el secreto ✨ (0/6)</div>
      
      <div class="cards-grid">
        <div class="card-item" onclick="openCard(0)">
          <span class="card-icon" id="icon-0">💌</span>
          <span class="card-title">Carta 1</span>
        </div>
        <div class="card-item" onclick="openCard(1)">
          <span class="card-icon" id="icon-1">🌻</span>
          <span class="card-title">Carta 2</span>
        </div>
        <div class="card-item" onclick="openCard(2)">
          <span class="card-icon" id="icon-2">✨</span>
          <span class="card-title">Carta 3</span>
        </div>
        <div class="card-item" onclick="openCard(3)">
          <span class="card-icon" id="icon-3">☀️</span>
          <span class="card-title">Carta 4</span>
        </div>
        <div class="card-item" onclick="openCard(4)">
          <span class="card-icon" id="icon-4">💛</span>
          <span class="card-title">Carta 5</span>
        </div>
        <div class="card-item" onclick="openCard(5)">
          <span class="card-icon" id="icon-5">📜</span>
          <span class="card-title">Carta 6</span>
        </div>
      </div>

      <button class="secret-letter-btn" id="secretBtn" onclick="openSecretLetter()">
        ✨ Abrir Carta Secreta Final ✨
      </button>
    </div>

    <div class="canvas-box">
      <button class="start-btn" id="startBtn">Toca para Iniciar 🌻</button>
      <canvas id="tree-canvas" width="480" height="520"></canvas>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <h2 id="modalTitle">Mensaje Especial</h2>
      <p id="modalBody"></p>
      <div class="modal-actions">
        <a id="whatsappBtn" class="whatsapp-btn" target="_blank" rel="noopener noreferrer">
          💚 Responder por WhatsApp
        </a>
        <button class="close-btn" onclick="closeModal()">Cerrar</button>
      </div>
    </div>
  </div>

  <div class="audio-container" id="audioContainer" style="display: none;">
    <button class="audio-control" id="audioBtn">🎵 Música: Activada</button>
    <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.05" value="0.10">
  </div>

  <audio id="bg-music" loop preload="auto">
    <source src="snowman.mp3" type="audio/mpeg">
  </audio>

  <script>
    // --- EDITA TU NÚMERO DE WHATSAPP AQUÍ ---
    const whatsappNumber = "18090000000"; 
    const whatsappMessage = encodeURIComponent("¡Me encantó tu detalle de las flores amarillas! 🌻💛 Te amo mucho.");

    // --- 1. LÓGICA DE LA CUENTA REGRESIVA ELEGANTE ---
    function padZero(num) {
      return num < 10 ? '0' + num : num;
    }

    function updateCountdown() {
      const now = new Date();
      let targetYear = now.getFullYear();
      
      let anniversaryDate = new Date(targetYear, 0, 22, 0, 0, 0); // Enero
      if (now > anniversaryDate) {
        anniversaryDate = new Date(targetYear + 1, 0, 22, 0, 0, 0);
      }

      const diff = anniversaryDate - now;

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById("cd-days").innerText = padZero(days);
      document.getElementById("cd-hours").innerText = padZero(hours);
      document.getElementById("cd-mins").innerText = padZero(minutes);
      document.getElementById("cd-secs").innerText = padZero(seconds);
    }
    setInterval(updateCountdown, 1000);
    updateCountdown();

    // --- 2. FRASES DINÁMICAS ---
    const loveQuotes = [
      "✨ Un detalle hecho con todo el corazón ✨",
      "🌻 'Tú traes luz a cada uno de mis días' 🌻",
      "💛 Las mejores historias se construyen paso a paso 💛",
      "✨ Gracias por iluminar mi vida ✨"
    ];
    let quoteIndex = 0;
    const topBanner = document.getElementById("topBanner");

    function rotateQuotes() {
      topBanner.classList.remove("visible");
      setTimeout(() => {
        quoteIndex = (quoteIndex + 1) % loveQuotes.length;
        topBanner.innerText = loveQuotes[quoteIndex];
        topBanner.classList.add("visible");
      }, 1000);
    }
    setInterval(rotateQuotes, 7000);

    // --- 3. FONDO DE LUCIÉRNAGAS, PÉTALOS Y ESTRELLA MÁGICA ---
    const bgCanvas = document.getElementById("bg-canvas");
    const bgCtx = bgCanvas.getContext("2d");
    let particles = [];
    let petals = [];
    let sparkTrail = [];

    function resizeBg() {
      bgCanvas.width = window.innerWidth;
      bgCanvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeBg);
    resizeBg();

    window.addEventListener("mousemove", (e) => {
      for (let i = 0; i < 2; i++) {
        sparkTrail.push({
          x: e.clientX,
          y: e.clientY,
          size: Math.random() * 3 + 1,
          speedX: (Math.random() - 0.5) * 1.5,
          speedY: (Math.random() - 0.5) * 1.5,
          alpha: 1
        });
      }
    });

    window.addEventListener("touchmove", (e) => {
      const touch = e.touches[0];
      for (let i = 0; i < 2; i++) {
        sparkTrail.push({
          x: touch.clientX,
          y: touch.clientY,
          size: Math.random() * 3 + 1,
          speedX: (Math.random() - 0.5) * 1.5,
          speedY: (Math.random() - 0.5) * 1.5,
          alpha: 1
        });
      }
    });

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * bgCanvas.width;
        this.y = Math.random() * bgCanvas.height;
        this.size = Math.random() * 2.5 + 0.8;
        this.speedX = (Math.random() - 0.5) * 0.4;
        this.speedY = (Math.random() - 0.5) * 0.4;
        this.alpha = Math.random() * 0.7 + 0.2;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.alpha += Math.sin(Date.now() * 0.003) * 0.008;
        if (this.x < 0 || this.x > bgCanvas.width || this.y < 0 || this.y > bgCanvas.height) this.reset();
      }
      draw() {
        bgCtx.save();
        bgCtx.globalAlpha = Math.max(0.1, Math.min(0.9, this.alpha));
        bgCtx.fillStyle = "#fbbf24";
        bgCtx.shadowBlur = 12;
        bgCtx.shadowColor = "#fbbf24";
        bgCtx.beginPath();
        bgCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        bgCtx.fill();
        bgCtx.restore();
      }
    }

    class Petal {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * bgCanvas.width;
        this.y = -20;
        this.size = Math.random() * 5 + 4;
        this.speedY = Math.random() * 0.8 + 0.4;
        this.speedX = Math.random() * 0.5 - 0.25;
        this.angle = Math.random() * Math.PI * 2;
        this.spin = (Math.random() - 0.5) * 0.02;
        this.alpha = Math.random() * 0.6 + 0.3;
      }
      update() {
        this.y += this.speedY;
        this.x += Math.sin(this.y * 0.01) + this.speedX;
        this.angle += this.spin;
        if (this.y > bgCanvas.height + 20) this.reset();
      }
      draw() {
        bgCtx.save();
        bgCtx.translate(this.x, this.y);
        bgCtx.rotate(this.angle);
        bgCtx.globalAlpha = this.alpha;
        
        let grad = bgCtx.createLinearGradient(0, 0, 0, this.size * 2);
        grad.addColorStop(0, "#fbbf24");
        grad.addColorStop(1, "#f59e0b");
        bgCtx.fillStyle = grad;

        bgCtx.beginPath();
        bgCtx.ellipse(0, 0, this.size / 2, this.size, 0, 0, Math.PI * 2);
        bgCtx.fill();
        bgCtx.restore();
      }
    }

    for (let i = 0; i < 75; i++) particles.push(new Particle());
    for (let i = 0; i < 25; i++) petals.push(new Petal());

    function animateBg() {
      bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      petals.forEach(p => { p.update(); p.draw(); });

      for (let i = sparkTrail.length - 1; i >= 0; i--) {
        const s = sparkTrail[i];
        s.x += s.speedX;
        s.y += s.speedY;
        s.alpha -= 0.02;
        if (s.alpha <= 0) {
          sparkTrail.splice(i, 1);
        } else {
          bgCtx.save();
          bgCtx.globalAlpha = s.alpha;
          bgCtx.fillStyle = "#fef08a";
          bgCtx.shadowBlur = 10;
          bgCtx.shadowColor = "#fbbf24";
          bgCtx.beginPath();
          bgCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          bgCtx.fill();
          bgCtx.restore();
        }
      }

      requestAnimationFrame(animateBg);
    }
    animateBg();

    // --- 4. CONTENIDO Y LÓGICA DE CARTAS ---
    const cardMessages = [
      { title: "Detalle Único", text: "Cada pequeño detalle cuenta cuando se trata de hacer sonreír a alguien especial." },
      { title: "Luz Amarilla", text: "Los girasoles siempre buscan la luz del sol; tú traes esa misma calidez a mi vida." },
      { title: "Construcción", text: "Las cosas más bellas no se compran, se construyen con tiempo, dedicación y cariño." },
      { title: "Un Día Especial", text: "Hoy es un día para recordar lo valioso que es compartir momentos llenos de luz." },
      { title: "Agradecimiento", text: "Gracias por estar presente y por iluminar cada día con tu esencia." },
      { title: "El Último Paso", text: "Has abierto todas las cartas. Ahora estás lista para leer el verdadero mensaje..." }
    ];

    const secretMessage = {
      title: "Para Ti ✨",
      text: "Las flores de un jardín terminan por marchitarse, pero las que se construyen con tiempo, dedicación y código duran para siempre.\n\nGracias por iluminar cada uno de mis días.\n\n¡Feliz Día de las Flores Amarillas! 🌻"
    };

    let openedCount = 0;
    const openedState = new Array(6).fill(false);

    function openCard(index) {
      if (!openedState[index]) {
        openedState[index] = true;
        openedCount++;
        const cardElem = document.querySelectorAll('.card-item')[index];
        cardElem.classList.add('opened');
        document.getElementById(`icon-${index}`).innerText = "💛";
        updateCounter();
      }
      showModal(cardMessages[index].title, cardMessages[index].text, false);
    }

    function launchExplosion() {
      const duration = 2.5 * 1000;
      const animationEnd = Date.now() + duration;
      const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 1000 };

      function randomInRange(min, max) { return Math.random() * (max - min) + min; }

      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) return clearInterval(interval);

        const particleCount = 50 * (timeLeft / duration);
        confetti({ ...defaults, particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }, colors: ['#fbbf24', '#f59e0b', '#fef08a', '#ffffff'] });
        confetti({ ...defaults, particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }, colors: ['#fbbf24', '#f59e0b', '#fef08a', '#ffffff'] });
      }, 250);
    }

    function updateCounter() {
      const badge = document.getElementById("counterBadge");
      badge.innerText = `Abre las 6 cartas para desbloquear el secreto ✨ (${openedCount}/6)`;
      
      if (openedCount === 6) {
        badge.innerText = "¡🎉 Desbloqueaste el Secreto Final! 🎉";
        badge.classList.add("unlocked");
        document.getElementById("secretBtn").classList.add("visible");
        launchExplosion();
      }
    }

    function openSecretLetter() { showModal(secretMessage.title, secretMessage.text, true); }

    function showModal(title, text, isSecret = false) {
      document.getElementById("modalTitle").innerText = title;
      document.getElementById("modalBody").innerText = text;

      const waBtn = document.getElementById("whatsappBtn");
      if (isSecret) {
        waBtn.href = `https://wa.me/${whatsappNumber}?text=${whatsappMessage}`;
        waBtn.style.display = "inline-flex";
      } else {
        waBtn.style.display = "none";
      }

      document.getElementById("modalOverlay").classList.add("active");
    }

    function closeModal() { document.getElementById("modalOverlay").classList.remove("active"); }

    // --- 5. DIBUJO REALISTA DEL ÁRBOL ---
    const treeCanvas = document.getElementById("tree-canvas");
    const ctx = treeCanvas.getContext("2d");
    const startBtn = document.getElementById("startBtn");
    const cardsPanel = document.getElementById("cardsPanel");
    const audioContainer = document.getElementById("audioContainer");
    const audioBtn = document.getElementById("audioBtn");
    const volumeSlider = document.getElementById("volumeSlider");
    const bgMusic = document.getElementById("bg-music");

    bgMusic.volume = 0.10;
    let flowerTargets = [];

    function getHeartPoint(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
      return { x: x * 10, y: y * 10 };
    }

    function drawSunflower(x, y, size) {
      ctx.save();
      ctx.translate(x, y);
      ctx.shadowBlur = 10;
      ctx.shadowColor = "rgba(251, 191, 36, 0.4)";
      
      const petalCount = 12;
      for (let i = 0; i < petalCount; i++) {
        ctx.beginPath();
        ctx.rotate((Math.PI * 2) / petalCount);
        let grad = ctx.createLinearGradient(0, 0, 0, size);
        grad.addColorStop(0, "#f59e0b");
        grad.addColorStop(0.7, "#fbbf24");
        grad.addColorStop(1, "#fef08a");
        ctx.fillStyle = grad;
        ctx.ellipse(0, size * 0.7, size / 3.2, size * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(0, 0, size * 0.45, 0, Math.PI * 2);
      ctx.fillStyle = "#3b1700";
      ctx.fill();
      ctx.restore();
    }

    function drawRealisticTrunk(callback) {
      let grad = ctx.createLinearGradient(200, 500, 280, 200);
      grad.addColorStop(0, '#27170a');
      grad.addColorStop(0.5, '#422510');
      grad.addColorStop(1, '#5c3317');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(215, 500);
      ctx.quadraticCurveTo(225, 380, 220, 250);
      ctx.quadraticCurveTo(240, 230, 260, 250);
      ctx.quadraticCurveTo(255, 380, 265, 500);
      ctx.closePath();
      ctx.fill();

      const branches = [
        { sx: 230, sy: 340, ex: 140, ey: 220, w: 8 },
        { sx: 245, sy: 310, ex: 330, ey: 210, w: 8 },
        { sx: 232, sy: 260, ex: 170, ey: 160, w: 5 },
        { sx: 248, sy: 250, ex: 300, ey: 150, w: 5 }
      ];

      let bIndex = 0;
      function drawNextBranch() {
        if (bIndex < branches.length) {
          const b = branches[bIndex];
          ctx.beginPath();
          ctx.strokeStyle = '#422510';
          ctx.lineWidth = b.w;
          ctx.lineCap = "round";
          ctx.moveTo(b.sx, b.sy);
          ctx.lineTo(b.ex, b.ey);
          ctx.stroke();
          bIndex++;
          setTimeout(drawNextBranch, 100);
        } else if (callback) callback();
      }
      drawNextBranch();
    }

    function growFlowers() {
      let i = 0;
      function step() {
        if (i < flowerTargets.length) {
          const f = flowerTargets[i];
          drawSunflower(f.x, f.y, f.size);
          i++;
          requestAnimationFrame(step);
        } else {
          cardsPanel.classList.add('visible');
        }
      }
      step();
    }

    startBtn.addEventListener("click", () => {
      startBtn.style.display = "none";
      topBanner.classList.add("visible");
      bgMusic.volume = parseFloat(volumeSlider.value);
      bgMusic.play().catch(err => console.log(err));
      audioContainer.style.display = "flex";

      const centerX = 240;
      const centerY = 190;
      for (let i = 0; i < 240; i++) {
        const t = Math.random() * Math.PI * 2;
        const pt = getHeartPoint(t);
        const r = Math.sqrt(Math.random());
        flowerTargets.push({
          x: centerX + pt.x * r,
          y: centerY + pt.y * r,
          size: Math.random() * 3.5 + 4
        });
      }

      flowerTargets.sort((a, b) => b.y - a.y);
      drawRealisticTrunk(() => growFlowers());
    });

    let isPlaying = true;
    audioBtn.addEventListener("click", () => {
      if (isPlaying) {
        bgMusic.pause();
        audioBtn.innerText = "🔇 Música: Pausada";
        isPlaying = false;
      } else {
        bgMusic.play();
        audioBtn.innerText = "🎵 Música: Activada";
        isPlaying = true;
      }
    });

    volumeSlider.addEventListener("input", (e) => {
      bgMusic.volume = parseFloat(e.target.value);
    });
  </script>
</body>
</html>
